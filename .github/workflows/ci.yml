name: CI
# Throwaway test comment; changes no job, command or behavior.

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going. Pushes to
# main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: poetry
      # The backend group is optional in pyproject.toml; the tests import it.
      - run: poetry install --with backend,dev --no-interaction
      - run: poetry run pytest -v

  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: poetry
      - run: poetry install --with backend,dev --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pyright

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same flags as frontend/Dockerfile.
      - run: npm ci --ignore-scripts
      - run: npm test

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # `build` runs `tsc -b && vite build`, so it is also the type check.
      - run: npm run build
