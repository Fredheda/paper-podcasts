[project]
name = "paper-podcasts"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<3.14"
dependencies = [
    "arxiv==2.3.1",
    "requests==2.32.5",
    "markitdown[all]==0.1.4",
    "python-statemachine==2.5.0",
    "openai==2.13.0",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.backend]
optional = true

[tool.poetry.group.backend.dependencies]
fastapi = "0.128.5"
uvicorn = {version = "0.40.0", extras = ["standard"]}
azure-storage-blob = "12.30.0"
azure-identity = "1.25.3"
mssql-python = "1.12.0"

[tool.poetry.group.streamlit]
optional = true

[tool.poetry.group.streamlit.dependencies]
streamlit = "1.52.2"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
httpx = "0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
