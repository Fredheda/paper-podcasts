[project]
name = "paper-podcasts"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<3.14"
dependencies = [
    "arxiv==2.3.1",
    "requests==2.32.5",
    "markitdown[all]==0.1.4",
    "python-statemachine==2.5.0",
    "anthropic==0.75.0",
    "openai==2.13.0",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.backend]
optional = true

[tool.poetry.group.backend.dependencies]
fastapi = "0.128.5"
uvicorn = {version = "0.40.0", extras = ["standard"]}

[tool.poetry.group.streamlit]
optional = true

[tool.poetry.group.streamlit.dependencies]
streamlit = "1.52.2"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
